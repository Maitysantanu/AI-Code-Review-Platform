services:
  mysql:
    image: mysql:8.4
    container_name: repomind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: repomind
    ports:
      - "3306:3306"
    volumes:
      - repomind_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  repomind_mysql_data: